<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="memora-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26201C"/>
      <stop offset="100%" stop-color="#181412"/>
    </linearGradient>
    <linearGradient id="memora-gold" x1="120" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E5D0"/>
      <stop offset="50%" stop-color="#D9C3A0"/>
      <stop offset="100%" stop-color="#B89B73"/>
    </linearGradient>
    <linearGradient id="memora-sparkle" x1="360" y1="120" x2="410" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3E5D0"/>
      <stop offset="100%" stop-color="#D9C3A0"/>
    </linearGradient>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#memora-bg)"/>
  
  <!-- Outer & Inner Delicate Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="98" stroke="url(#memora-gold)" stroke-width="3" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="460" height="460" rx="90" stroke="url(#memora-gold)" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Serif M Letterform (Cormorant Garamond aesthetic) -->
  <path d="
    M 124 152 
    H 182 
    C 172 152, 166 158, 166 170 
    V 338 
    L 242 152 
    H 270 
    L 346 338 
    V 170 
    C 346 158, 340 152, 330 152 
    H 388 
    C 378 152, 372 158, 372 170 
    V 342 
    C 372 354, 378 360, 388 360 
    H 338 
    L 256 182 
    L 174 360 
    H 124 
    C 134 360, 140 354, 140 342 
    V 170 
    C 140 158, 134 152, 124 152 
    Z
  " fill="url(#memora-gold)"/>

  <!-- Solid refined high-contrast silhouette pass for readability at 16x16 / 32x32 -->
  <path d="
    M 132 150
    H 176
    V 162
    C 166 162, 162 166, 162 176
    V 336
    C 162 346, 166 350, 176 350
    V 362
    H 132
    V 350
    C 142 350, 146 346, 146 336
    V 176
    C 146 166, 142 162, 132 162
    Z
  " fill="url(#memora-gold)"/>

  <path d="
    M 336 150
    H 380
    V 162
    C 370 162, 366 166, 366 176
    V 336
    C 366 346, 370 350, 380 350
    V 362
    H 336
    V 350
    C 346 350, 350 346, 350 336
    V 176
    C 350 166, 346 162, 336 162
    Z
  " fill="url(#memora-gold)"/>

  <path d="
    M 160 168
    L 256 364
    L 352 168
    H 330
    L 256 320
    L 182 168
    Z
  " fill="url(#memora-gold)"/>

  <!-- Four-Point Golden Star Sparkle at Top Right Apex -->
  <g transform="translate(372, 142)" filter="url(#soft-glow)">
    <path d="
      M 0 -28
      Q 0 0, 28 0
      Q 0 0, 0 28
      Q 0 0, -28 0
      Q 0 0, 0 -28
      Z
    " fill="url(#memora-sparkle)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
